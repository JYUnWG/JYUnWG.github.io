<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>委託作品｜君君 JYUN</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --text: #e5e7eb;
      --muted: #94a3b8;
      --line: rgba(255, 255, 255, .08);
    }

    body {
      margin: 0;
      min-height: 100svh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", Arial, sans-serif;
      background: linear-gradient(135deg, #0b1220, #111827);
      color: var(--text);
    }

    .wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left));
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .back {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .05);
      color: var(--text);
      text-decoration: none;
      font-size: 20px;
    }

    h1 { margin: 0; font-size: 22px; }

    .count { color: var(--muted); font-size: 14px; margin-left: auto; }

    /* ---------- 作品格子 ---------- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }

    .work {
      display: block;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: #111827;
      text-decoration: none;
      cursor: zoom-in;
      transition: transform .2s, box-shadow .2s;
    }

    .work:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, .35);
    }

    .work img {
      display: block;
      background: #f4f5f7;
      width: 100%;
      aspect-ratio: 1;
      object-fit: contain;
    }

    .work .cap {
      display: block;
      padding: 7px 10px;
      background: #111827;
      color: var(--muted);
      font-size: 13px;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ---------- 大圖檢視 ---------- */
    .viewer {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      flex-direction: column;
      background: rgba(5, 8, 15, .96);
    }

    .viewer.open { display: flex; }

    .v-top {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: max(10px, env(safe-area-inset-top)) 14px 10px;
    }

    .v-index { color: var(--muted); font-size: 14px; flex: 1; }

    .v-btn {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, .14);
      background: rgba(255, 255, 255, .06);
      color: #fff;
      font-size: 20px;
      cursor: pointer;
    }

    .v-stage {
      position: relative;
      flex: 1;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 0 12px;
      touch-action: pan-y pinch-zoom;
      user-select: none;
      -webkit-user-select: none;
    }

    .v-stage img {
      display: block;
      max-width: min(100%, 1400px);
      /* 扣掉上方列與下方繪師資訊的高度，電腦版整張圖都看得到 */
      max-height: calc(100vh - 150px);
      max-height: calc(100dvh - 150px);
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 10px;
      background: #f4f5f7;
      transition: transform .2s ease, opacity .2s ease;
      -webkit-user-drag: none;
    }

    .v-prev, .v-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
    }

    .v-prev { left: 12px; }
    .v-next { right: 12px; }

    .v-info {
      padding: 12px 16px max(16px, env(safe-area-inset-bottom));
      text-align: center;
      font-size: 15px;
      color: var(--muted);
      min-height: 50px;
    }

    .v-info strong { color: var(--text); }
    .v-info a { color: #7dd3fc; }

    @media (max-width: 600px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .v-prev, .v-next { display: none; } /* 手機用左右滑 */
    }
  </style>
</head>

<body>

  <div class="wrap">

    <header>
      <a class="back" href="../" aria-label="回首頁">←</a>
      <h1>委託作品</h1>
      <span class="count" id="count"></span>
    </header>

    <div class="grid" id="grid"></div>

  </div>

  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="作品大圖">
    <div class="v-top">
      <span class="v-index" id="vIndex"></span>
      <button class="v-btn" id="vClose" aria-label="關閉">✕</button>
    </div>
    <div class="v-stage" id="vStage">
      <img id="vImg" alt="" />
      <button class="v-btn v-prev" id="vPrev" aria-label="上一張">‹</button>
      <button class="v-btn v-next" id="vNext" aria-label="下一張">›</button>
    </div>
    <div class="v-info" id="vInfo"></div>
  </div>

  <script src="works.js"></script>
  <script>
  (() => {
    const works = window.WORKS || [];
    const $ = (id) => document.getElementById(id);
    const grid = $("grid"), viewer = $("viewer"), vImg = $("vImg");

    $("count").textContent = `共 ${works.length} 張`;

    // 繪師文字（安全地建立節點，不用 innerHTML）
    function credit(w, el) {
      el.textContent = "";
      if (w.title) {
        const t = document.createElement("strong");
        t.textContent = w.title;
        el.append(t);
      }
      if (w.artist) {
        if (w.title) el.append("　");
        el.append("繪師：");
        if (w.link) {
          const a = document.createElement("a");
          a.href = w.link;
          a.target = "_blank";
          a.rel = "noopener";
          a.textContent = w.artist;
          el.append(a);
        } else {
          el.append(w.artist);
        }
      }
    }

    // ---------- 格子 ----------
    works.forEach((w, i) => {
      const a = document.createElement("a");
      a.className = "work";
      a.href = `#${i + 1}`;
      const img = document.createElement("img");
      img.src = `thumb/${w.file}`;
      img.alt = w.title || `委託作品 ${i + 1}`;
      img.loading = "lazy";
      a.append(img);
      const cap = document.createElement("span");
      cap.className = "cap";
      cap.textContent = [w.title, w.artist && `繪師：${w.artist}`].filter(Boolean).join("・") || `作品 ${i + 1}`;
      a.append(cap);
      grid.append(a);
    });

    // ---------- 大圖 ----------
    let current = -1;
    let openedHere = false; // 是不是在這頁點開的（關閉時用「上一頁」回到格子）

    function show(i) {
      current = (i + works.length) % works.length;
      const w = works[current];
      vImg.src = `img/${w.file}`;
      vImg.alt = w.title || `委託作品 ${current + 1}`;
      $("vIndex").textContent = `${current + 1} / ${works.length}`;
      credit(w, $("vInfo"));
      viewer.classList.add("open");
      document.body.style.overflow = "hidden";
      // 預先載入前後兩張
      [current - 1, current + 1].forEach((k) => {
        const n = works[(k + works.length) % works.length];
        if (n) new Image().src = `img/${n.file}`;
      });
    }

    function hide() {
      viewer.classList.remove("open");
      document.body.style.overflow = "";
      current = -1;
    }

    function fromHash() {
      const n = parseInt(location.hash.slice(1), 10);
      if (n >= 1 && n <= works.length) show(n - 1);
      else hide();
    }

    function go(step) {
      const n = ((current + step + works.length) % works.length) + 1;
      history.replaceState(null, "", `#${n}`);
      show(n - 1);
    }

    function close() {
      if (openedHere) {
        openedHere = false;
        history.back();
      } else {
        history.replaceState(null, "", location.pathname);
        hide();
      }
    }

    grid.addEventListener("click", (e) => {
      if (e.target.closest(".work")) openedHere = true;
    });

    window.addEventListener("hashchange", fromHash);
    $("vClose").addEventListener("click", close);
    $("vPrev").addEventListener("click", () => go(-1));
    $("vNext").addEventListener("click", () => go(1));

    // 點圖片外面也可以關閉
    $("vStage").addEventListener("click", (e) => {
      if (e.target === $("vStage")) close();
    });

    document.addEventListener("keydown", (e) => {
      if (current < 0) return;
      if (e.key === "Escape") close();
      else if (e.key === "ArrowLeft") go(-1);
      else if (e.key === "ArrowRight") go(1);
    });

    // 手機左右滑換圖
    let sx = null, sy = 0;
    const stage = $("vStage");
    stage.addEventListener("touchstart", (e) => {
      if (e.touches.length !== 1) { sx = null; return; }
      sx = e.touches[0].clientX;
      sy = e.touches[0].clientY;
    }, { passive: true });
    stage.addEventListener("touchmove", (e) => {
      if (sx === null || e.touches.length !== 1) return;
      const dx = e.touches[0].clientX - sx;
      if (Math.abs(dx) > Math.abs(e.touches[0].clientY - sy)) {
        vImg.style.transform = `translateX(${dx * 0.6}px)`;
        vImg.style.transition = "none";
      }
    }, { passive: true });
    stage.addEventListener("touchend", (e) => {
      if (sx === null) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - sx, dy = t.clientY - sy;
      vImg.style.transition = "";
      vImg.style.transform = "";
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.2) go(dx < 0 ? 1 : -1);
      sx = null;
    });

    fromHash();
  })();
  </script>

</body>
</html>
